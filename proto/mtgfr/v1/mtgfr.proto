syntax = "proto3";

package mtgfr.v1;

import "mtgfr/v1/catalog.proto";
import "mtgfr/v1/common.proto";
import "mtgfr/v1/intent.proto";
import "mtgfr/v1/stream.proto";

option java_multiple_files = true;

// Auth, Decks, Cards, Game, Tables. Shared vocabulary lives in common.proto.

message Me {
  int64 id = 1;
  string email = 2;
  string username = 3;
}

message SignupRequest {
  string email = 1;
  string password = 2;
  string username = 3;
}

message SignupResponse {
  Me me = 1;
  string session_token = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  Me me = 1;
  string session_token = 2;
}

message LogoutRequest {}

message LogoutResponse {}

message GetMeRequest {}

message GetMeResponse {
  int64 id = 1;
  string email = 2;
  string username = 3;
}

service AuthService {
  rpc Signup(SignupRequest) returns (SignupResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
}

message CreateRequest {
  string name = 1;
  string commander = 2;
  string commander_print = 3;
  repeated DeckCardEntry cards = 4;
}

message CreateResponse {
  int64 id = 1;
  string name = 2;
  string commander = 3;
  string commander_print = 4;
  repeated DeckCardEntry cards = 5;
}

message ListRequest {}

message ListResponse {
  repeated DeckSummary decks = 1;
}

message GetRequest {
  int64 id = 1;
}

message GetResponse {
  int64 id = 1;
  string name = 2;
  string commander = 3;
  string commander_print = 4;
  repeated DeckCardEntry cards = 5;
}

message UpdateRequest {
  int64 id = 1;
  DeckSaveBody request = 2;
}

message UpdateResponse {
  int64 id = 1;
  string name = 2;
  string commander = 3;
  string commander_print = 4;
  repeated DeckCardEntry cards = 5;
}

message DeleteRequest {
  int64 id = 1;
}

message DeleteResponse {}

service DecksService {
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc List(ListRequest) returns (ListResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Update(UpdateRequest) returns (UpdateResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

message LeaderboardEntry {
  int64 user_id = 1;
  string username = 2;
  int32 rating = 3;
  uint32 rank = 4;
}

message GetLeaderboardRequest {
  uint32 limit = 1;
  uint32 offset = 2;
}

message GetLeaderboardResponse {
  repeated LeaderboardEntry entries = 1;
  uint32 total = 2;
}

service RatingsService {
  rpc GetLeaderboard(GetLeaderboardRequest) returns (GetLeaderboardResponse);
}

message CatalogRequest {}

message CatalogResponse {
  repeated CatalogCard cards = 1;
}

message SearchRequest {
  string q = 1;
  uint32 limit = 2;
  uint32 offset = 3;
}

message SearchResponse {
  repeated CatalogCard cards = 1;
}

message LookupRequest {
  repeated string ids = 1;
}

message LookupResponse {
  repeated CatalogCard cards = 1;
}

service CardsService {
  rpc Catalog(CatalogRequest) returns (CatalogResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc Lookup(LookupRequest) returns (LookupResponse);
}

message StreamRequest {
  string table_id = 1;
}

message SubmitIntentRequest {
  string table_id = 1;
  IntentEnvelope envelope = 2;
}

message SubmitIntentResponse {
  bool accepted = 1;
  reserved 2;
  reserved "reason";
  optional MessageRef reject_reason = 3;
}

message SetYieldRequest {
  string table_id = 1;
  bool enabled = 2;
}

message SetYieldResponse {
  bool accepted = 1;
  reserved 2;
  reserved "reason";
  optional MessageRef reject_reason = 3;
}

message SetTurnYieldRequest {
  string table_id = 1;
  bool enabled = 2;
}

message SetTurnYieldResponse {
  bool accepted = 1;
  reserved 2;
  reserved "reason";
  optional MessageRef reject_reason = 3;
}

message SetStackDwellRequest {
  string table_id = 1;
  bool dwelling = 2;
}

message SetStackDwellResponse {
  bool accepted = 1;
  reserved 2;
  reserved "reason";
  optional MessageRef reject_reason = 3;
}

service GameService {
  rpc Stream(StreamRequest) returns (stream StreamResponse);
  rpc SubmitIntent(SubmitIntentRequest) returns (SubmitIntentResponse);
  rpc SetYield(SetYieldRequest) returns (SetYieldResponse);
  rpc SetTurnYield(SetTurnYieldRequest) returns (SetTurnYieldResponse);
  rpc SetStackDwell(SetStackDwellRequest) returns (SetStackDwellResponse);
}

service TablesService {
  rpc Seed(SeedRequest) returns (SeedResponse);
}
