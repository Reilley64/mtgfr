[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The card-DSL vocabulary (`CardDef`, `Effect`, filters, mana, triggers) is defined by
# `cards`; the engine implements the rules logic around it and re-exports the types so
# `engine::Effect` and friends keep resolving for `schema` / `server`.
cards = { workspace = true }
blake3 = "1"
tracing = { version = "0.1", default-features = false, features = ["attributes"] }

[dev-dependencies]
toml = "0.8"
