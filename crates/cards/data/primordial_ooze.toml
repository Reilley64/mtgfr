# This creature attacks each combat if able.
# At the beginning of your upkeep, put a +1/+1 counter on this creature. Then you may pay {X}, where
# X is the number of +1/+1 counters on it. If you don't, tap this creature and it deals X damage to
# you.
name = "Primordial Ooze"
id = "133109c3-a2ca-4231-b3b1-baa700800b07"
default_print = "a53d8d6d-b8d3-4f71-a88a-5d639ce2925f"
oracle = "This creature attacks each combat if able.\nAt the beginning of your upkeep, put a +1/+1 counter on this creature. Then you may pay {X}, where X is the number of +1/+1 counters on it. If you don't, tap this creature and it deals X damage to you."
otags = [
    "burn-you",
    "drawback",
    "forced-attacker",
    "gains-pp-counters",
    "mana-sink",
    "repeatable-pp-counters",
    "triggered-ability",
    "upkeep-cost",
]
subtypes = ["Ooze"]

[cost]
red = 1

[kind]
type = "creature"
power = 1
toughness = 1

# This creature attacks each combat if able.
[[abilities]]
oracle = "This creature attacks each combat if able."
timing = "static"

# This creature attacks each combat if able.
[[abilities.effects]]
type = "static"
mode = "must_attack_each_combat"
self_only = true

# At the beginning of your upkeep, put a +1/+1 counter on this creature. Then you may pay {X}, where
# X is the number of +1/+1 counters on it. If you don't, tap this creature and it deals X damage to
# you.
[[abilities]]
oracle = "At the beginning of your upkeep, put a +1/+1 counter on this creature. Then you may pay {X}, where X is the number of +1/+1 counters on it. If you don't, tap this creature and it deals X damage to you."
timing = "upkeep"

# put a +1/+1 counter on this creature.
[[abilities.effects]]
type = "counters"
mode = "put_counters"
count = 1
target = "this"

# Then you may pay {X}, where X is the number of +1/+1 counters on it. If you don't, tap this
# creature and it deals X damage to you. X is a board read taken as the offer is made — the counter
# above is already on — not a value the payer chooses, so it rides in `extra_generic`, not `x`.
[[abilities.effects]]
type = "choice"
mode = "pay_or_else"
cost = {}
extra_generic = "per_counter_on_source"
otherwise = [
    { type = "control", mode = "tap_source" },
    { type = "damage", mode = "to_players", amount = "per_counter_on_source" },
]
