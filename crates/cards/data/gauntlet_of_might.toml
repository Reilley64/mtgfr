# Red creatures get +1/+1.
# Whenever a Mountain is tapped for mana, its controller adds an additional {R}.
name = "Gauntlet of Might"
otags = ["anthem", "mana-increaser", "power-boost-to-all", "symmetrical", "synergy-mountain", "synergy-red", "toughness-boost-to-all", "triggered-ability", "uninspired"]
sets = ["2ed", "30a", "ced", "cei", "lea", "leb", "me4", "prm"]
id = "d38ad188-515e-4865-a0ed-5d0fd4c7b453"
default_print = "407650c3-9388-45c3-a599-6929c7d6e5bd"
oracle = "Red creatures get +1/+1.\nWhenever a Mountain is tapped for mana, its controller adds an additional {R}."

[cost]
generic = 4

[kind]
type = "artifact"

# Red creatures get +1/+1.
[[abilities]]
timing = "static"

# Red creatures get +1/+1. Every red creature on the table, not just its controller's.
[[abilities.effects]]
type = "static"
mode = "anthem"
colors = ["red"]
all_players = true
power = 1
toughness = 1

# Whenever a Mountain is tapped for mana, its controller adds an additional {R}.
[[abilities]]
timing = "static"

# Whenever a Mountain is tapped for mana, its controller adds an additional {R}. A mana ability
# doesn't use the stack (CR 605.3), so this is the inline bonus watch rather than a triggered
# ability. The subtype filter reads the effective type line, so a dual Mountain counts (CR 305.6).
[[abilities.effects]]
type = "static"
mode = "tapped_for_mana_bonus"
scope = { any_land = { types = "land", subtypes = ["Mountain"] } }
bonus_color = { fixed = "red" }
