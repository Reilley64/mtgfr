# Choose one or more —
# • Destroy all creatures.
# • Destroy all planeswalkers.
# • Destroy all battles.
# • Exile all graveyards.
# • Each opponent loses all counters.
name = "Final Act"
sets = ["m3c", "mar", "soc"]
id = "335a6c6a-030f-45d4-806c-467a22962eed"
default_print = "a86671d1-4f4b-486e-a0b3-671608974a82"
otags = ["modal", "removal-battle", "removal-creature", "removal-destroy", "removal-planeswalker", "remove-counters-other", "remove-counters-player", "sweeper", "sweeper-graveyard"]
oracle = "Choose one or more —\n• Destroy all creatures.\n• Destroy all planeswalkers.\n• Destroy all battles.\n• Exile all graveyards.\n• Each opponent loses all counters."
modal = true
choose = 1
choose_max = 5

[cost]
generic = 4
black = 2

[kind]
type = "sorcery"

# Mode 0 — "Destroy all creatures."
[[abilities]]
timing = "spell"

# Destroy all creatures.
[[abilities.effects]]
type = "destroy"
mode = "all"
filter = "creatures"

# Mode 1 — "Destroy all planeswalkers."
[[abilities]]
timing = "spell"

# Destroy all planeswalkers.
[[abilities.effects]]
type = "destroy"
mode = "all"
filter = { types = "planeswalker" }

# Mode 2 — "Destroy all battles."
[[abilities]]
timing = "spell"

# Destroy all battles.
[[abilities.effects]]
type = "destroy"
mode = "all"
filter = { types = "battle" }

# Mode 3 — "Exile all graveyards."
[[abilities]]
timing = "spell"

# Exile all graveyards.
[[abilities.effects]]
type = "exile"
mode = "all_graveyards"

# Mode 4 — "Each opponent loses all counters."
[[abilities]]
timing = "spell"

# Each opponent loses all counters.
[[abilities.effects]]
type = "counters"
mode = "remove_all_player_counters"
who = "each_opponent"
