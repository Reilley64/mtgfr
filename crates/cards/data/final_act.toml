# Choose one or more —
# • Destroy all creatures.
# • Destroy all planeswalkers.
# • Destroy all battles.
# • Exile all graveyards.
# • Each opponent loses all counters.
#
# ponytail: the printed card has five modes; four are expressible (destroy all creatures, destroy
# all planeswalkers, exile all graveyards, each opponent loses all counters), so `choose_max` opens
# "one or more" over those four (mirroring Casualties of War's precedent for a partial-mode "choose
# one or more" pool). "Destroy all battles" is dropped — battles aren't a modeled permanent type —
# so the modal indices below don't line up 1:1 with the print (mode 3 here is the print's fifth
# mode).
name = "Final Act"
id = "335a6c6a-030f-45d4-806c-467a22962eed"
default_print = "a86671d1-4f4b-486e-a0b3-671608974a82"
otags = ["modal", "removal-battle", "removal-creature", "removal-destroy", "removal-planeswalker", "remove-counters-other", "remove-counters-player", "sweeper", "sweeper-graveyard"]
oracle = "Choose one or more —\n• Destroy all creatures.\n• Destroy all planeswalkers.\n• Destroy all battles.\n• Exile all graveyards.\n• Each opponent loses all counters."
set = "soc"
approximates = "\"destroy all battles\" is dropped — battles aren't a modeled permanent type. \"Choose one or more\" is offered over the remaining four modes (destroy all creatures / destroy all planeswalkers / exile all graveyards / each opponent loses all counters)."
modal = true
choose = 1
choose_max = 4

[cost]
generic = 4
black = 2

[kind]
type = "sorcery"

# Mode 0 — "Destroy all creatures."
[[abilities]]
timing = "spell"

# Destroy all creatures.
[[abilities.effects]]
type = "destroy"
mode = "all"
filter = "creatures"

# Mode 1 — "Destroy all planeswalkers."
[[abilities]]
timing = "spell"

# Destroy all planeswalkers.
[[abilities.effects]]
type = "destroy"
mode = "all"
filter = { types = "planeswalker" }

# Mode 2 — "Exile all graveyards."
[[abilities]]
timing = "spell"

# Exile all graveyards.
[[abilities.effects]]
type = "exile"
mode = "all_graveyards"

# Mode 3 — "Each opponent loses all counters." (the print's fifth mode; "destroy all battles" is
# the dropped one, so the modal indices here don't line up 1:1 with the printed order.)
[[abilities]]
timing = "spell"

# Each opponent loses all counters.
[[abilities.effects]]
type = "counters"
mode = "remove_all_player_counters"
scope = "each_opponent"
