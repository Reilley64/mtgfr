# Enchant creature
# Whenever enchanted creature deals damage to you, this Aura deals that much damage to that
# creature's controller.
name = "Backfire"
otags = ["burn-player", "parasitic-aura", "punisher", "triggered-ability"]
subtypes = ["Aura"]
id = "e04fa58e-be7a-4c9c-98d0-48241742a41b"
default_print = "04bc57aa-d4d9-4bd9-ba09-984370c7e23b"
oracle = "Enchant creature\nWhenever enchanted creature deals damage to you, this Aura deals that much damage to that creature's controller."

# Enchant creature
enchant = { types = "creature" }

[cost]
blue = 1

[kind]
type = "aura"

# Whenever enchanted creature deals damage to you, ... — combat or noncombat alike; "you" is this
# Aura's controller, not the enchanted creature's.
[[abilities]]
timing = "enchanted_creature_deals_damage_to_you"

# ...this Aura deals that much damage to that creature's controller.
[[abilities.effects]]
type = "damage"
mode = "to_players"
who = "damaging_permanents_controller"
amount = "triggering_damage_dealt"
