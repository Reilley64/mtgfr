# Whenever this creature blocks or becomes blocked by a non-Wall creature, destroy that
# creature at end of combat.
name = "Thicket Basilisk"
otags = ["block-trigger", "delayed-trigger", "hate-blocker", "old-blocking-deathtouch", "removal-creature", "removal-destroy", "repeatable-removal", "spot-removal", "synergy-blocker-self"]
id = "c4822813-cd81-465d-9fe8-3a4c2dcd31ef"
default_print = "32401b72-e351-45fa-a16e-33cc818a07e0"
oracle = "Whenever this creature blocks or becomes blocked by a non-Wall creature, destroy that creature at end of combat."
subtypes = ["Basilisk"]

[cost]
generic = 3
green = 2

[kind]
type = "creature"
power = 2
toughness = 4

# Whenever this creature blocks or becomes blocked by a non-Wall creature, destroy that
# creature at end of combat.
[[abilities]]
timing = "blocks_or_becomes_blocked_by"
filter = { types = "creature", exclude_subtypes = ["Wall"] }

# destroy that creature at end of combat
[[abilities.effects]]
type = "destroy"
mode = "that_creature"
at = "end_combat"
