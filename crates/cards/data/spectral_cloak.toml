# Enchant creature
# Enchanted creature has shroud as long as it's untapped. (It can't be the target of spells or
# abilities.)
name = "Spectral Cloak"
otags = ["gives-shroud", "protects-creature", "synergy-untapped"]
sets = ["leg"]
id = "fadfa9f9-d096-4083-8630-1c18928133ff"
default_print = "7524fd0d-a675-41d6-bc99-bd3ba336893b"
oracle = "Enchant creature\nEnchanted creature has shroud as long as it's untapped. (It can't be the target of spells or abilities.)"
subtypes = ["Aura"]

[cost]
blue = 2

[kind]
type = "aura"

# Enchanted creature has shroud as long as it's untapped. (It can't be the target of spells or
# abilities.)
[[abilities]]
timing = "static"
# "as long as it's untapped" — "it" is the enchanted creature, not this Aura.
condition = { type = "enchanted_permanent_untapped" }

# Enchanted creature has shroud
[[abilities.effects]]
type = "static"
mode = "grant_to_attached"
keywords = ["shroud"]
