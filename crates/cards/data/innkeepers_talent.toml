# (Gain the next level as a sorcery to add its ability.)
# At the beginning of combat on your turn, put a +1/+1 counter on target creature you control.
# {G}: Level 2
# Permanents you control with counters on them have ward {1}.
# {3}{G}: Level 3
# If you would put one or more counters on a permanent or player, put twice that many of each of
# those kinds of counters on that permanent or player instead.
name = "Innkeeper's Talent"
otags = ["activated-ability", "counter-doubler", "counters-matter", "cycle-blb-r-talent", "energy-increaser", "gives-pp-counters", "gives-ward", "repeatable-pp-counters", "rhystic", "triggered-ability"]
id = "915b75d1-b5e3-4aca-a54c-beaccef0a2e4"
default_print = "941b0afc-0e8f-45f2-ae7f-07595e164611"
oracle = "(Gain the next level as a sorcery to add its ability.)\nAt the beginning of combat on your turn, put a +1/+1 counter on target creature you control.\n{G}: Level 2\nPermanents you control with counters on them have ward {1}.\n{3}{G}: Level 3\nIf you would put one or more counters on a permanent or player, put twice that many of each of those kinds of counters on that permanent or player instead."
subtypes = ["Class"]
approximates = "Level 2's ward misses this Class itself: the engine tracks a Class's level as a plain level scalar, not as the level counters CR 717.2 puts on it, so a leveled Class never satisfies its own \"with counters on them\" filter."

