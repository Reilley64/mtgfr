# Cast this spell only during your declare attackers step.
# This turn, instead of declaring blockers, each defending player chooses any number of
# creatures they control and divides them into a number of piles equal to the number of
# attacking creatures for whom that player is the defending player. Creatures those players
# control that can block additional creatures may likewise be put into additional piles. Assign
# each pile to a different one of those attacking creatures at random. Each creature in a pile
# that can block the creature that pile is assigned to does so. (Piles can be empty.)
name = "Camouflage"
otags = ["combat-timing-restriction", "control-blocker", "notorious-templating", "pile", "rules-nightmare", "single-english-word-name"]
id = "9cf44db4-627a-4197-9588-6da72e41f03d"
default_print = "09243dc6-c56c-42a8-969b-2ecffe89e1ca"
oracle = "Cast this spell only during your declare attackers step.\nThis turn, instead of declaring blockers, each defending player chooses any number of creatures they control and divides them into a number of piles equal to the number of attacking creatures for whom that player is the defending player. Creatures those players control that can block additional creatures may likewise be put into additional piles. Assign each pile to a different one of those attacking creatures at random. Each creature in a pile that can block the creature that pile is assigned to does so. (Piles can be empty.)"
approximates = "\"Creatures those players control that can block additional creatures may likewise be put into additional piles\" is dropped: each creature goes in at most one pile, so a Two-Headed Giant of Foriys can only be dealt to one attacker. \"This turn\" is read as this combat — the piles are divided as the spell resolves, so a second combat phase gets an ordinary declare-blockers step."

# Cast this spell only during your declare attackers step.
cast_only_during_declare_attackers = true

[cost]
green = 1

[kind]
type = "instant"

# Cast this spell only during your declare attackers step.
# This turn, instead of declaring blockers, each defending player chooses any number of creatures
# they control and divides them into a number of piles equal to the number of attacking creatures
# for whom that player is the defending player. Assign each pile to a different one of those
# attacking creatures at random. Each creature in a pile that can block the creature that pile is
# assigned to does so. (Piles can be empty.)
[[abilities]]
timing = "spell"
condition = { type = "during_your_turn" }

# This turn, instead of declaring blockers, each defending player chooses any number of creatures
# they control and divides them into a number of piles equal to the number of attacking creatures
# for whom that player is the defending player. Assign each pile to a different one of those
# attacking creatures at random. Each creature in a pile that can block the creature that pile is
# assigned to does so. (Piles can be empty.)
[[abilities.effects]]
type = "choice"
mode = "defenders_divide_blockers_among_attackers"
