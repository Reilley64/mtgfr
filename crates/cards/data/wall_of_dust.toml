# Defender (This creature can't attack.)
# Whenever this creature blocks a creature, that creature can't attack during its controller's next turn.
name = "Wall of Dust"
otags = ["block-trigger", "prevent-attack", "typal-wall"]
id = "14895574-9c87-4e80-9bc9-cc3dd22a42b8"
default_print = "aaf53dfe-5d48-4811-b2f5-5a5c1cb462ca"
oracle = "Defender (This creature can't attack.)\nWhenever this creature blocks a creature, that creature can't attack during its controller's next turn."
subtypes = ["Wall"]
keywords = ["defender"]

[cost]
generic = 2
red = 1

[kind]
type = "creature"
power = 1
toughness = 4

# Whenever this creature blocks a creature, that creature can't attack during its controller's
# next turn.
# (Authored as the blocks-or-becomes-blocked-by pair trigger, which is what carries "that creature".
# The becomes-blocked half is unreachable: a Wall with defender never attacks, so it never becomes
# blocked.)
[[abilities]]
timing = "blocks_or_becomes_blocked_by"
filter = { types = "creature" }

# that creature can't attack during its controller's next turn.
[[abilities.effects]]
type = "misc"
mode = "that_creature_cant_attack_next_own_turn"
