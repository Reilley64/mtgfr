oracle = "Flying\nWhen Bladewing enters, you may return target Dragon permanent card from your graveyard to the battlefield.\n{B}{R}: Dragon creatures get +1/+1 until end of turn."
set = "cmd"
subtypes = ["Zombie", "Dragon"]
legendary = true
keywords = ["flying"]

[cost]
generic = 3
black = 2
red = 2

[kind]
type = "creature"
power = 4
