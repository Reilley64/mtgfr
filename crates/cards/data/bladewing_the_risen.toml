# {B}{R}: Dragon creatures get +1/+1 until end of turn.
[[abilities]]
timing = "activated"
activation_cost = { black = 1, red = 1 }

# Dragon creatures get +1/+1 until end of turn.
[[abilities.effects]]
type = "pump"
mode = "pump_each_creature_until_end_of_turn"
power = 1
toughness = 1
filter = { subtypes = ["Dragon"] }
