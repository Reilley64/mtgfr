# Return target card from your graveyard to your hand. If you return a nonland card to your hand this way, Vengeful
# Rebirth deals damage equal to that card's mana value to any target.
# Exile Vengeful Rebirth.
name = "Vengeful Rebirth"
otags = ["burn-any", "cycle-mm2-draft-signpost", "exile-on-resolution", "hand-neutral", "multiple-targets", "regrowth-any", "scales-with-mana-value", "spot-removal"]
sets = ["arb", "cmd", "mm2", "plst", "uma"]
oracle = "Return target card from your graveyard to your hand. If you return a nonland card to your hand this way, Vengeful Rebirth deals damage equal to that card's mana value to any target.\nExile Vengeful Rebirth."
id = "522297b1-493a-4c62-a82a-3017c44183e8"
default_print = "b03bb160-8113-409a-a130-2b3fdc476e6a"

[cost]
generic = 4
red = 1
green = 1

[kind]
type = "sorcery"

# Return target card from your graveyard to your hand. If you return a nonland card to your hand this way, Vengeful
# Rebirth deals damage equal to that card's mana value to any target.
# Exile Vengeful Rebirth.
[[abilities]]
timing = "spell"

# Return target card from your graveyard to your hand.
[[abilities.effects]]
type = "zone"
mode = "return_from_graveyard_to_hand"
target = { card_in_graveyard = { whose = "yours", filter = "any_card" } }

# If you return a nonland card to your hand this way, Vengeful Rebirth deals damage equal to that card's mana value to
# any target.
[[abilities.effects]]
type = "damage"
mode = "target"
amount = "returned_nonland_card_mana_value"
target = "any"

# Exile Vengeful Rebirth.
[[abilities.effects]]
type = "zone"
mode = "exile_self_on_resolve"
