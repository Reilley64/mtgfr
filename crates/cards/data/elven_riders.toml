# This creature can't be blocked except by Walls and/or creatures with flying. (Authored inverted, as every
# "can't be blocked by" restriction is: the filter names the creatures turned away — the ones that are neither a
# Wall nor a flyer, since either exception on its own lets a blocker through.)
[[abilities.effects]]
type = "static"
mode = "cant_be_blocked_by"
filter = { types = "creature", exclude_subtypes = ["Wall"], without_flying = true }
