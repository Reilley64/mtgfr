# Enchant land
# When enchanted land becomes tapped, destroy it. That land's controller may attach this Aura
# to a land of their choice.
name = "Kudzu"
otags = ["hate-tapped", "removal-destroy", "removal-land", "single-english-word-name", "spot-removal", "transferrable-aura", "triggered-ability", "uninspired"]
id = "51ca5965-ae39-4e51-8948-9a230a03f906"
default_print = "f92ec34e-e374-462f-aa9c-257558defb1f"
oracle = "Enchant land\nWhen enchanted land becomes tapped, destroy it. That land's controller may attach this Aura to a land of their choice."
subtypes = ["Aura"]

# Enchant land
enchant = { types = "land" }

[cost]
generic = 1
green = 2

[kind]
type = "aura"

# When enchanted land becomes tapped, destroy it. That land's controller may attach this Aura
# to a land of their choice.
[[abilities]]
oracle = "When enchanted land becomes tapped, destroy it. That land's controller may attach this Aura to a land of their choice."
timing = "enchanted_permanent_becomes_tapped"

# destroy it
[[abilities.effects]]
type = "destroy"
mode = "target"
target = "enchanted_creature"

# That land's controller may attach this Aura to a land of their choice.
[[abilities.effects]]
type = "choice"
mode = "triggering_player_may_attach_this_aura_to_chosen"
filter = { types = "land" }
