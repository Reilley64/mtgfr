# Enchant creature
# {0}: Enchanted creature becomes the color or colors of your choice. Activate only once each turn.
name = "Dream Coat"
otags = ["activated-ability", "color-change", "untracked-indefinite-effect"]
id = "988aaf54-2e46-4afc-ae37-b0a01191a1f1"
default_print = "07edbbf4-c3d6-4ec1-ae9b-4ae202fb6998"
oracle = "Enchant creature\n{0}: Enchanted creature becomes the color or colors of your choice. Activate only once each turn."
subtypes = ["Aura"]
# ponytail: "the color or colors of your choice" narrows to exactly one colour — the colour choice
# that pauses resolution carries a single `Color` all the way out to the wire, so a multi-colour
# pick needs a new pending-choice/intent pair. Increment #191.
approximates = "The chosen colour set is always a single colour; multicolour choices aren't offered."
enchant = { types = "creature" }

[cost]
blue = 1

[kind]
type = "aura"

# {0}: Enchanted creature becomes the color or colors of your choice. Activate only once each turn.
[[abilities]]
oracle = "{0}: Enchanted creature becomes the color or colors of your choice. Activate only once each turn."
timing = "activated"
once_each_turn = true

# Enchanted creature becomes the color or colors of your choice.
[[abilities.effects]]
type = "pump"
mode = "target_becomes_color"
target = "enchanted_creature"
