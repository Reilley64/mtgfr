# This creature enters with seven +1/+0 counters on it.
# At end of combat, if this creature attacked or blocked this combat, remove a +1/+0 counter
# from it.
# {X}, {T}: Put up to X +1/+0 counters on this creature. This ability can't cause the total
# number of +1/+0 counters on this creature to be greater than seven. Activate only during your
# upkeep.
name = "Clockwork Beast"
otags = ["activated-ability", "deprecated-p-t-counter", "intervening-if-clause", "type-addition-from-none"]
id = "eb97c8db-ac6c-476c-b14d-87785e9c82f0"
default_print = "c7741816-0bc1-4540-b4b2-006275ffe572"
oracle = "This creature enters with seven +1/+0 counters on it.\nAt end of combat, if this creature attacked or blocked this combat, remove a +1/+0 counter from it.\n{X}, {T}: Put up to X +1/+0 counters on this creature. This ability can't cause the total number of +1/+0 counters on this creature to be greater than seven. Activate only during your upkeep."
subtypes = ["Beast"]

[cost]
generic = 6

[kind]
type = "creature"
power = 0
toughness = 4
also = ["artifact"]

# This creature enters with seven +1/+0 counters on it.
[[abilities]]
oracle = "This creature enters with seven +1/+0 counters on it."
timing = "static"

# This creature enters with seven +1/+0 counters on it.
[[abilities.effects]]
type = "static"
mode = "enters_with_counters"
count = 7
kind = "plus_one_plus_zero"

# At end of combat, if this creature attacked or blocked this combat, remove a +1/+0 counter
# from it.
[[abilities]]
oracle = "At end of combat, if this creature attacked or blocked this combat, remove a +1/+0 counter from it."
timing = "end_of_combat"

# if this creature attacked or blocked this combat
[abilities.condition]
type = "source_attacked_or_blocked_this_combat"

# remove a +1/+0 counter from it.
[[abilities.effects]]
type = "counters"
mode = "remove_counter_from_self"
kind = "plus_one_plus_zero"

# {X}, {T}: Put up to X +1/+0 counters on this creature. This ability can't cause the total
# number of +1/+0 counters on this creature to be greater than seven. Activate only during your
# upkeep.
# ponytail: "up to X" is taken as X (clamped by the cap below) rather than a resolution-time
# choice — the activator already paid the X, and putting fewer +1/+0 counters on a 0/4 is never
# what they wanted. Prompt for the number if a card ever makes a smaller pile the better one.
[[abilities]]
timing = "activated"
taps_self = true

[abilities.activation_cost]
x = true

# Activate only during your upkeep.
[abilities.condition]
type = "during_your_upkeep"

# Put up to X +1/+0 counters on this creature. This ability can't cause the total number of
# +1/+0 counters on this creature to be greater than seven.
[[abilities.effects]]
type = "counters"
mode = "put_counters"
target = "this"
count = "x"
kind = "plus_one_plus_zero"
max_total = 7
