# As an additional cost to cast this spell, you may sacrifice one or more creatures. When you do, copy this spell for
# each creature sacrificed this way.
# You draw a card and lose 1 life.
name = "Plumb the Forbidden"
sets = ["blc", "soc", "stx"]
id = "b099fc54-cdbc-46cb-b4e4-7c2ca77b115b"
default_print = "79c27df1-0c05-4208-a80c-73185ab35424"
otags = ["copy-self", "delayed-trigger", "hand-neutral", "hand-positive", "life-for-cards", "plunder", "pure-draw", "sacrifice-outlet-creature"]
oracle = "As an additional cost to cast this spell, you may sacrifice one or more creatures. When you do, copy this spell for each creature sacrificed this way.\nYou draw a card and lose 1 life."
flavor = "Strixhaven forbade all magic from the Blood Age, so that is where Extus began his research."

[cost]
generic = 1
black = 1

[cost.additional]
sacrifice = { count = "one_or_more", filter = "creature" }

[kind]
type = "instant"

# You draw a card and lose 1 life.
[[abilities]]
timing = "spell"

# You draw a card
[[abilities.effects]]
type = "draw"
mode = "cards"
count = 1

# and lose 1 life.
[[abilities.effects]]
type = "life"
mode = "lose"
amount = 1

# When you do [sacrifice creatures to the additional cost], copy this spell for each creature
# sacrificed this way. A cast-time reflexive trigger (CR 603.4): the `spell_sacrificed_to_cast`
# intervening-if gates it on having actually sacrificed, so with nothing sacrificed the trigger
# doesn't happen at all (no zero-count copy trigger on the stack). When it does fire the copies sit
# on the stack above the original; `spell_sacrifice_count` reads the cost already paid at cast.
# Plumb is untargeted, so the copies need no retarget choice.
[[abilities]]
timing = "when_you_cast_this"

[abilities.condition]
type = "spell_sacrificed_to_cast"

# copy this spell for each creature sacrificed this way.
[[abilities.effects]]
type = "copy"
mode = "copy_triggering_spell"
count = "spell_sacrifice_count"
