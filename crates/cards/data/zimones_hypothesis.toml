# You may put a +1/+1 counter on a creature. Then choose odd or even. Return each creature with power of the chosen
# quality to its owner's hand. (Zero is even.)
# Zimone's Hypothesis {3}{U}{U} — an instant (soc). Oracle:
#   "You may put a +1/+1 counter on a creature. Then choose odd or even. Return each creature with
#    power of the chosen quality to its owner's hand. (Zero is even.)"
name = "Zimone's Hypothesis"
id = "ae27fa09-ab73-44b4-8e86-44d626ec221d"
default_print = "f91afbaf-e035-47cd-b493-0d5817fefa76"
otags = ["even-odd-matters", "gives-pp-counters", "namesake-spell", "removal-bounce", "removal-creature", "sweeper-one-sided"]
oracle = "You may put a +1/+1 counter on a creature. Then choose odd or even. Return each creature with power of the chosen quality to its owner's hand. (Zero is even.)"

[cost]
generic = 3
blue = 2

[kind]
type = "instant"

# The whole printed sequence resolves in order (CR 608): the two effects auto-compose into a
# Sequence — the optional counter primer, then the parity choose-one — so the mass bounce reads
# each creature's post-counter power, and neither the counter target nor odd/even is announced on
# the stack at cast.
[[abilities]]
timing = "spell"

# You may put a +1/+1 counter on a creature. (A resolution-time, non-targeted optional — declining
# still runs the parity bounce below, since it's the next Sequence step, not this primer's "if you
# do".)
[[abilities.effects]]
type = "choice"
mode = "may_put_counter_on_creature"

# Then choose odd or even. Return each creature with power of the chosen quality to its owner's
# hand. A resolution-time "choose one" between the two parities (zero is even).
[[abilities.effects]]
type = "choose_one"
options = [
    { type = "zone", mode = "return_all_to_hand", filter = { types = "creature", power_parity = "odd" } },
    { type = "zone", mode = "return_all_to_hand", filter = { types = "creature", power_parity = "even" } },
]
