# Enchant creature
enchant = { types = "creature" }

[cost]
blue = 2

[kind]
type = "aura"

# Enchanted creature can't be blocked except by Walls.
[[abilities]]
oracle = "Enchanted creature can't be blocked except by Walls."
timing = "static"

# Enchanted creature can't be blocked except by Walls. (Authored inverted, as every "can't be
# blocked by" restriction is: the filter names the creatures turned away.)
[[abilities.effects]]
type = "static"
mode = "grant_to_attached"
cant_be_blocked_by = { types = "creature", exclude_subtypes = ["Wall"] }
