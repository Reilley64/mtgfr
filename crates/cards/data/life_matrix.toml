# {4}, {T}: Put a matrix counter on target creature and that creature gains "Remove a matrix
# counter from this creature: Regenerate this creature." Activate only during your upkeep.
[[abilities]]
oracle = "{4}, {T}: Put a matrix counter on target creature and that creature gains \"Remove a matrix counter from this creature: Regenerate this creature.\" Activate only during your upkeep."
timing = "activated"
taps_self = true
only_during_your_upkeep = true

[abilities.activation_cost]
generic = 4

# Put a matrix counter on target creature and that creature gains "Remove a matrix counter from
# this creature: Regenerate this creature."
# The granted ability rides on the counter itself (Cyclopean Tomb's mire counter, Glyph of
# Delusion's glyph counter): the grant has no duration and so outlives the Matrix, and
# `Game::granted_activated_abilities` hands the regenerate ability to anything holding one.
[[abilities.effects]]
type = "counters"
mode = "put_counters"
count = 1
target = "creature"
kind = "matrix"
