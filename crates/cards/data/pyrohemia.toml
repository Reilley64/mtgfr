# At the beginning of the end step, if no creatures are on the battlefield, sacrifice this enchantment.
# {R}: This enchantment deals 1 damage to each creature and each player.
name = "Pyrohemia"
otags = ["activated-ability", "burn-creature", "burn-player-each", "intervening-if-clause", "mana-sink", "pinger", "repeatable-removal", "sweeper"]
id = "9ac57a10-3402-4656-9079-f713884cde35"
default_print = "7e17b8ee-9de9-44d8-958b-3fced717ed32"
oracle = "At the beginning of the end step, if no creatures are on the battlefield, sacrifice this enchantment.\n{R}: This enchantment deals 1 damage to each creature and each player."

[cost]
generic = 2
red = 2

[kind]
type = "enchantment"

# At the beginning of the end step, if no creatures are on the battlefield, sacrifice this
# enchantment.
[[abilities]]
oracle = "At the beginning of the end step, if no creatures are on the battlefield, sacrifice this enchantment."
timing = "each_end_step"

[abilities.condition]
type = "compare"
left = "per_creature_on_battlefield"
op = "at_most"
right = 0

# if no creatures are on the battlefield, sacrifice this enchantment.
[[abilities.effects]]
type = "conditional"
condition = { type = "compare", left = "per_creature_on_battlefield", op = "at_most", right = 0 }
then = [{ type = "sacrifice", mode = "source" }]

# {R}: This enchantment deals 1 damage to each creature and each player.
[[abilities]]
oracle = "{R}: This enchantment deals 1 damage to each creature and each player."
timing = "activated"
activation_cost = { red = 1 }

# This enchantment deals 1 damage to each creature ...
[[abilities.effects]]
type = "damage"
mode = "each_creature"
amount = 1

# ... and each player.
[[abilities.effects]]
type = "damage"
mode = "to_players"
who = "each_player"
amount = 1
