# Put X glyph counters on target creature that target Wall blocked this turn, where X is the power
# of that blocked creature. The creature gains "This creature doesn't untap during your untap step
# if it has a glyph counter on it" and "At the beginning of your upkeep, remove a glyph counter from
# this creature."
name = "Glyph of Delusion"
sets = ["leg"]
id = "e23ba169-4eb5-4083-a199-ac7e3026e67f"
default_print = "ee39da13-4b8a-4796-a7c2-aaa11992d573"
oracle = "Put X glyph counters on target creature that target Wall blocked this turn, where X is the power of that blocked creature. The creature gains \"This creature doesn't untap during your untap step if it has a glyph counter on it\" and \"At the beginning of your upkeep, remove a glyph counter from this creature.\""
# ponytail: the Wall is a second target clause the engine derives from the
# `blocked_by_a_wall_this_turn` restriction rather than an authored `target` — see
# `Effect::second_target` and `Game::narrow_blocked_by_target_wall_clause`, which cuts clause 1
# down to the Walls that blocked whatever clause 0 named. The two granted abilities are the glyph
# counter itself (`Game::doesnt_untap` and the upkeep tick both read the counter), so they behave
# faithfully but are not on the creature as abilities another card could copy or remove — #132.
approximates = "the two granted abilities are modeled by the glyph counter rather than granted to the creature (increment #132)."

[cost]
blue = 1

[kind]
type = "instant"

# Put X glyph counters on target creature that target Wall blocked this turn, where X is the power
# of that blocked creature. The creature gains "This creature doesn't untap during your untap step
# if it has a glyph counter on it" and "At the beginning of your upkeep, remove a glyph counter from
# this creature."
[[abilities]]
timing = "spell"

# Put X glyph counters on target creature that target Wall blocked this turn, where X is the power
# of that blocked creature.
[[abilities.effects]]
type = "counters"
mode = "put_counters"
kind = "glyph"
count = "target_power"
target = { permanent = { types = "creature", blocked_by_a_wall_this_turn = true } }
