# Cast this spell only during combat before blockers are declared.
# Target creature defending player controls can block any number of creatures this turn. It
# blocks each attacking creature this turn if able.
name = "Blaze of Glory"
otags = ["block-unlimited", "combat-timing-restriction", "force-blocker", "single-target-instant-sorcery"]
sets = ["2ed", "30a", "ced", "cei", "lea", "leb", "me4"]
id = "b330ac89-790e-4cc9-96a5-532c48252088"
default_print = "2d636573-287d-4f6f-93b0-12ddd8f3e6d1"
oracle = "Cast this spell only during combat before blockers are declared.\nTarget creature defending player controls can block any number of creatures this turn. It blocks each attacking creature this turn if able."

# Cast this spell only during combat before blockers are declared. (Both halves of the window: one
# flag opens combat, the other closes it at the declaration.)
cast_only_during_combat = true
cast_only_before_blockers = true

[cost]
white = 1

[kind]
type = "instant"

# Target creature defending player controls can block any number of creatures this turn. It
# blocks each attacking creature this turn if able.
[[abilities]]
timing = "spell"

# Target creature defending player controls can block any number of creatures this turn. It
# blocks each attacking creature this turn if able.
[[abilities.effects]]
type = "misc"
mode = "blocks_each_attacker_if_able"
target = { permanent = { types = "creature", controller = "defending_player" } }
