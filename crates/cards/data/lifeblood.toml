[kind]
type = "enchantment"

# Whenever a Mountain an opponent controls becomes tapped, ... — any tap, not just one for mana, so
# an attack or an Icy Manipulator pays out too.
[[abilities]]
timing = "permanent_becomes_tapped"
filter = { types = "land", subtypes = ["Mountain"], controller = "opponent" }

# ...you gain 1 life.
[[abilities.effects]]
type = "life"
mode = "gain"
amount = 1
