# Whenever a Mountain an opponent controls becomes tapped, you gain 1 life.
name = "Lifeblood"
otags = ["hate-mountain", "hate-tapped", "repeatable-lifegain", "single-english-word-name", "triggered-ability", "uninspired"]
sets = ["leg"]
id = "a205cbbf-b16f-44c0-9299-175c36cd86db"
default_print = "4ecb1362-9a67-4d4c-8d69-9ac2ebf4d0b0"
oracle = "Whenever a Mountain an opponent controls becomes tapped, you gain 1 life."

[cost]
generic = 2
