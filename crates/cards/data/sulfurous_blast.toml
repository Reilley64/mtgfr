# Sulfurous Blast deals 2 damage to each creature and each player. If you cast this spell during
# your main phase, Sulfurous Blast deals 3 damage to each creature and each player instead.
name = "Sulfurous Blast"
otags = ["addendum", "burn-creature", "burn-player-each", "cycle-tsp-addendum", "self-replacement-effect", "sweeper"]
id = "f2b4f37b-270b-4746-83b3-51ff88ee3491"
default_print = "0ea341e5-73ec-49fb-b319-02161b74d5f8"
oracle = "Sulfurous Blast deals 2 damage to each creature and each player. If you cast this spell during your main phase, Sulfurous Blast deals 3 damage to each creature and each player instead."

[cost]
generic = 2
red = 2

[kind]
type = "instant"

# Sulfurous Blast deals 2 damage to each creature and each player. If you cast this spell during
# your main phase, Sulfurous Blast deals 3 damage to each creature and each player instead.
[[abilities]]
oracle = "Sulfurous Blast deals 2 damage to each creature and each player. If you cast this spell during your main phase, Sulfurous Blast deals 3 damage to each creature and each player instead."
timing = "spell"

# ... deals 2 damage (3 if cast during your main phase) to each creature ...
[[abilities.effects]]
type = "damage"
mode = "each_creature"
amount = { condition = { type = "spell_cast_during_main_phase" }, then = 3, else = 2 }

# ... and each player.
[[abilities.effects]]
type = "damage"
mode = "to_players"
who = "each_player"
amount = { condition = { type = "spell_cast_during_main_phase" }, then = 3, else = 2 }
