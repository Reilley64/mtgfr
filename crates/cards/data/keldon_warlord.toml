# Keldon Warlord's power and toughness are each equal to the number of non-Wall creatures you
# control.
name = "Keldon Warlord"
otags = ["cda-power", "cda-toughness", "typal-non-wall", "type-errata-lord", "warlord"]
id = "acc869f8-dcbe-4d57-baa0-3eef4aceb251"
default_print = "f2d0bc79-d2f8-43e7-9106-c0d01db31fa2"
oracle = "Keldon Warlord's power and toughness are each equal to the number of non-Wall creatures you control."
subtypes = ["Human", "Barbarian"]

[cost]
generic = 2
red = 2

# The printed box reads */*; the defining ability below supplies both numbers.
[kind]
type = "creature"
power = 0
toughness = 0

# Keldon Warlord's power and toughness are each equal to the number of non-Wall creatures you
# control.
[[abilities]]
oracle = "Keldon Warlord's power and toughness are each equal to the number of non-Wall creatures you control."
timing = "static"

# power and toughness are each equal to the number of non-Wall creatures you control
[[abilities.effects]]
type = "static"
mode = "base_power_toughness_from_amount"
power = { per_permanent = { types = "creature", exclude_subtypes = ["Wall"], controller = "you" } }
toughness = { per_permanent = { types = "creature", exclude_subtypes = ["Wall"], controller = "you" } }
