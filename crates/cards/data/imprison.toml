# Enchant creature
# Whenever a player activates an ability of enchanted creature with {T} in its activation cost that
# isn't a mana ability, you may pay {1}. If you do, counter that ability. If you don't, destroy this
# Aura.
# Whenever enchanted creature attacks or blocks, you may pay {1}. If you do, tap the creature,
# remove it from combat, and creatures it was blocking that had become blocked by only that creature
# this combat become unblocked. If you don't, destroy this Aura.
name = "Imprison"
otags = ["remove-from-combat", "single-english-word-name", "triggered-ability"]
id = "632de66b-2314-4299-847c-16a84bf9121f"
default_print = "12671381-beb7-41b8-9484-97f8aca5c981"
oracle = "Enchant creature\nWhenever a player activates an ability of enchanted creature with {T} in its activation cost that isn't a mana ability, you may pay {1}. If you do, counter that ability. If you don't, destroy this Aura.\nWhenever enchanted creature attacks or blocks, you may pay {1}. If you do, tap the creature, remove it from combat, and creatures it was blocking that had become blocked by only that creature this combat become unblocked. If you don't, destroy this Aura."
subtypes = ["Aura"]
enchant = { types = "creature" }

[cost]
black = 1

[kind]
type = "aura"

# Whenever a player activates an ability of enchanted creature with {T} in its activation cost that
# isn't a mana ability, you may pay {1}. If you do, counter that ability. If you don't, destroy this
# Aura.
[[abilities]]
oracle = "Whenever a player activates an ability of enchanted creature with {T} in its activation cost that isn't a mana ability, you may pay {1}. If you do, counter that ability. If you don't, destroy this Aura."
timing = "enchanted_creature_activates_tap_ability"

# you may pay {1}. If you do, counter that ability. If you don't, destroy this Aura.
[[abilities.effects]]
type = "choice"
mode = "pay_or_else"
cost = { generic = 1 }
# If you do, counter that ability.
then = [{ type = "misc", mode = "counter_triggering_ability" }]
# If you don't, destroy this Aura.
otherwise = [{ type = "destroy", mode = "target", target = "this" }]

# Whenever enchanted creature attacks or blocks, you may pay {1}. If you do, tap the creature,
# remove it from combat, and creatures it was blocking that had become blocked by only that creature
# this combat become unblocked. If you don't, destroy this Aura.
[[abilities]]
oracle = "Whenever enchanted creature attacks or blocks, you may pay {1}. If you do, tap the creature, remove it from combat, and creatures it was blocking that had become blocked by only that creature this combat become unblocked. If you don't, destroy this Aura."
timing = "enchanted_creature_attacks_or_blocks"

# you may pay {1}. If you do, tap the creature, remove it from combat, … If you don't, destroy this
# Aura.
[[abilities.effects]]
type = "choice"
mode = "pay_or_else"
cost = { generic = 1 }
then = [
  # tap the creature
  { type = "control", mode = "tap_target", target = "enchanted_creature" },
  # remove it from combat, and creatures it was blocking that had become blocked by only that
  # creature this combat become unblocked.
  { type = "control", mode = "remove_from_combat", release_solely_blocked = true, target = "enchanted_creature" },
]
# If you don't, destroy this Aura.
otherwise = [{ type = "destroy", mode = "target", target = "this" }]
