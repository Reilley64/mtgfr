[[printings]]
id = "34410953-113a-45ae-89d4-2ce39f75c3c6"
set = "sld"
flavor = "3.\nThe day draws back, the time of struggle ebbs. Sun-scarred relics lie about the land."

[[printings]]
id = "46ad38f6-ca2a-41a4-96cf-f41a41d54a37"
set = "sld"
flavor = "10.\nOn that day, then, the night will come to Lorwyn.\n—Narvek Riag, kithkin prophet"

[[printings]]
id = "54278194-fc8b-4208-a3ca-e655fddca2df"
set = "sld"
flavor = "5.\nHere, in the winding labyrinth, no shelter;"

[[printings]]
id = "6651e0fd-50ca-449e-84f1-ebb07fb305f5"
set = "sld"
flavor = "4.\nHere and there an oracle who sees the night ahead: the rude glimmer of it, tucked into the corners of our sky."

[[printings]]
id = "7b150a6d-a33d-456a-a2b0-286e43bc636e"
set = "sld"
flavor = "8.\nNight gathers where the flamekin wail, its fingers at their throats. Our compact with the darkness was for nothing."

[[printings]]
id = "a0627111-1390-43cb-84e7-d6c0e46c02ea"
set = "sld"
flavor = "6.\nHere, beneath an ancient throne, small comfort."

[[printings]]
id = "b373adfa-ebc2-4060-8ff3-d1f0eca03c02"
set = "sld"
flavor = "1.\nOne day, night will come to these mountains."

[[printings]]
id = "ba88d76e-d71f-43ea-a272-5dc8b5928c6b"
set = "sld"
flavor = "9.\nOne day, the day will find its furthest limit, the place beyond which no days are imagined: a place long sealed away, lost within the endless mountain range. One day, the night will find this place, and breach it."

[[printings]]
id = "e16f6a52-67d6-4215-9f3f-3b0a17dd8889"
set = "sld"
flavor = "2.\nOur days of idle pleasure winnow down; their sweetness doubles as their numbers dwindle."

[[printings]]
id = "ffbd0396-2e7b-4b87-9504-953bd35e4fea"
set = "sld"
flavor = "7.\nInto the dust of the road, the dusk must burrow. From crag to creekside and past all points beyond, the evening falls."

