# Enchant creature
# Enchanted creature can't be blocked except by artifact creatures and/or white creatures.
name = "Seeker"
otags = ["gives-evasion", "pseudo-intimidate", "single-english-word-name"]
sets = ["4bb", "4ed", "leg", "ren"]
id = "ca00eb17-e5c3-42c8-a665-431f5f95b67f"
default_print = "7052825f-d9fc-4820-b8c4-dbc204730b7c"
oracle = "Enchant creature\nEnchanted creature can't be blocked except by artifact creatures and/or white creatures."
subtypes = ["Aura"]

# Enchant creature
enchant = { types = "creature" }

[cost]
generic = 2
white = 2

[kind]
type = "aura"

# Enchanted creature can't be blocked except by artifact creatures and/or white creatures.
[[abilities]]
timing = "static"

# Enchanted creature can't be blocked except by artifact creatures and/or white creatures. (Authored inverted, as
# every "can't be blocked by" restriction is: the filter names the creatures turned away — the ones that are
# neither an artifact nor white, since either exception on its own lets a blocker through.)
[[abilities.effects]]
type = "static"
mode = "grant_to_attached"
cant_be_blocked_by = { types = "creature", exclude = "artifact", not_color = "white" }
