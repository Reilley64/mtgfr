# At the beginning of your upkeep, you may pay {R}{R}{R}. If you don't, tap Rohgahh and all
# creatures named Kobolds of Kher Keep, then an opponent gains control of them.
[[abilities]]
oracle = "At the beginning of your upkeep, you may pay {R}{R}{R}. If you don't, tap Rohgahh and all creatures named Kobolds of Kher Keep, then an opponent gains control of them."
timing = "upkeep"

# you may pay {R}{R}{R}. If you don't, tap Rohgahh and all creatures named Kobolds of Kher Keep,
# then an opponent gains control of them. The sweep is table-wide — the clause says "all creatures
# named", not "you control" — and one opponent, chosen as it resolves, takes the whole set.
[[abilities.effects]]
type = "choice"
mode = "pay_or_else"
cost = { red = 3 }
otherwise = [
    { type = "control", mode = "tap_source" },
    { type = "control", mode = "tap_all", filter = { name = "Kobolds of Kher Keep" } },
    { type = "control", mode = "opponent_gains_control_all", filter = { name = "Kobolds of Kher Keep" }, with_source = true },
]

# Creatures you control named Kobolds of Kher Keep get +2/+2.
[[abilities]]
oracle = "Creatures you control named Kobolds of Kher Keep get +2/+2."
timing = "static"

# Creatures you control named Kobolds of Kher Keep get +2/+2.
[[abilities.effects]]
type = "static"
mode = "filtered_anthem"
filter = { types = "creature", name = "Kobolds of Kher Keep", controller = "you" }
power = 2
toughness = 2
