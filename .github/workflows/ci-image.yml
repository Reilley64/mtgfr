name: CI image

# Publish ghcr.io/<owner>/mtgfr-ci:latest when the CI toolchain Dockerfile changes.
# Verify jobs do not consume this image until a follow-up PR (containerize + migrate job).

on:
  push:
    branches: [main, master]
    paths:
      - "docker/ci/**"
      - ".github/workflows/ci-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

env:
  REGISTRY: ghcr.io

jobs:
  docker-ci:
    name: Build mtgfr-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Image names (GHCR requires lowercase)
        id: image
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "ci=ghcr.io/${owner}/mtgfr-ci" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push mtgfr-ci
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ci/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.ci }}:latest
          cache-from: type=gha,scope=mtgfr-ci
          cache-to: type=gha,mode=max,scope=mtgfr-ci

  docker-ci-visibility:
    name: Make mtgfr-ci package public
    needs: [docker-ci]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          pkg=mtgfr-ci
          gh api --method PATCH \
            "/user/packages/container/${pkg}" \
            -f visibility=public || \
          gh api --method PATCH \
            "/orgs/${owner}/packages/container/${pkg}" \
            -f visibility=public || true
